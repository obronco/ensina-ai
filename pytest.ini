[pytest]
# Pytest configuration for Ensina AI

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=src
    --cov-report=term-missing
    --cov-report=html

# Test paths
testpaths = tests

# Markers for organizing tests
markers =
    unit: Unit tests (business logic only)
    integration: Integration tests
    slow: Slow running tests

# Coverage options
[coverage:run]
source = src
omit =
    */tests/*
    */conftest.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
